<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Table of friends</title>
</head>

<body>
    <div class="container mt-5">
        <!-- TABLE -->
        <table class="table table-striped table-hover table-bordered table-dark">

            <!-- TABLE HEADER -->
            <thead>
                <tr class="text-center">
                    <th class="col-2" scope="col">Profile</th>
                    <th class="col-2" scope="col">Name</th>
                    <th class="col-2" scope="col">Birthdate</th>
                </tr>
            </thead>

            <!-- TABLE BODY -->
            <tbody>

                <!-- Xydris -->
                <tr class="text-center">
                    <th scope="row"><img class="rounded-circle" src="hinata.jpg" alt=""></th>
                    <td>Xydris Cruz</td>
                    <td>Oct 1, 2012</td>
                </tr>

                <!-- Claire -->
                <tr class="text-center">
                    <th scope="col"><img class="rounded-circle" src="lewis.jpeg" alt=""></th>
                    <td>Claire Dayawon</td>
                    <td>March 3, 2012</td>
                </tr>

                <!-- Vitto -->
                <tr class="text-center">
                    <th scope="col"><img src="Lebron_James.png" alt=""></th>
                    <td>Vitto Mejia</td>
                    <td>Aug 20, 2011</td>
                </tr>

                <!-- Julia -->
                <tr class="text-center">
                    <td><img class="rounded-circle" src="Daniel.jpeg" alt=""></td>
                    <td>Julia Reyes</td>
                    <td>July 9, 2013</td>
                </tr>

                <!-- Gabbi -->
                <tr class="text-center">
                    <th scope="col"><img src="childe.png" alt=""></th>
                    <td>Gabbi Riofrio</td>
                    <td>March 19, 2012</td>
                </tr>

            </tbody>

        </table>
    </div>
</body>

</html>
